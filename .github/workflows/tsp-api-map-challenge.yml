# Single run via the same entrypoint as local cron: `scripts/run-cron.mjs --run-once …`
# (see `scripts/tsp_cron_service.ts` for allowed flag combinations).
#
# Required secrets: STAR_DELIVERY_BASE_URL, PLAYER_GUID, PLAYER_EMAIL
# Cron `--no-log-file` skips per-run route_solver_cron_*.log files (see workflow input no_log_file).

name: TSP cron (run-once)

on:
  workflow_dispatch:
    inputs:
      cron_mode:
        description: |
          Child CLI mode. For *_challenge modes set challenge_paths (comma-separated).
        type: choice
        options:
          - daily-api
          - api-map-daily-api
          - map-daily-api
          - api-map-challenge
          - map-challenge
        default: api-map-challenge
      map_path:
        description: Repo-relative map JSON (map-daily-api, map-challenge)
        type: string
        default: "data.json"
      challenge_paths:
        description: Comma-separated repo-relative challenge JSON paths (required for *_challenge modes)
        type: string
        default: challenges/challenges_all_with_fuel.json
      submit:
        description: Forward --submit to the child CLI
        type: boolean
        default: true
      log_dir:
        description: Log directory for cron tee output (relative to repo root)
        type: string
        default: logs
      no_log_file:
        description: |
          If true, passes --no-log-file to the cron script (no route_solver_cron_*.log; child output to job log only). Skips log artifact upload and does not mkdir log_dir.
        type: boolean
        default: false

jobs:
  cron-run-once:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      STAR_DELIVERY_BASE_URL: ${{ secrets.STAR_DELIVERY_BASE_URL }}
      PLAYER_GUID: ${{ secrets.PLAYER_GUID }}
      PLAYER_EMAIL: ${{ secrets.PLAYER_EMAIL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Run cron --run-once
        run: |
          NO_LOG="${{ github.event.inputs.no_log_file }}"
          if [ "$NO_LOG" != "true" ]; then
            mkdir -p "${{ github.event.inputs.log_dir }}"
          fi
          MODE="${{ github.event.inputs.cron_mode }}"
          MAP="${{ github.event.inputs.map_path }}"
          CP_RAW="${{ github.event.inputs.challenge_paths }}"
          SUBMIT="${{ github.event.inputs.submit }}"
          LOG_DIR="${{ github.event.inputs.log_dir }}"

          CRON_ARGS=(node ./scripts/run-cron.mjs --run-once)
          if [ "$NO_LOG" = "true" ]; then
            CRON_ARGS+=(--no-log-file)
          else
            CRON_ARGS+=(--log-dir="$LOG_DIR")
          fi
          if [ "$SUBMIT" = "true" ]; then
            CRON_ARGS+=(--submit)
          fi

          case "$MODE" in
            daily-api) ;;
            api-map-daily-api) CRON_ARGS+=(--api-map --daily-api) ;;
            map-daily-api) CRON_ARGS+=(--map "$MAP" --daily-api) ;;
            api-map-challenge)
              CRON_ARGS+=(--api-map)
              IFS=',' read -r -a CPS <<< "$CP_RAW"
              for p in "${CPS[@]}"; do
                p="${p#"${p%%[![:space:]]*}"}"
                p="${p%"${p##*[![:space:]]}"}"
                [ -n "$p" ] && CRON_ARGS+=(--challenge "$p")
              done
              ;;
            map-challenge)
              CRON_ARGS+=(--map "$MAP")
              IFS=',' read -r -a CPS <<< "$CP_RAW"
              for p in "${CPS[@]}"; do
                p="${p#"${p%%[![:space:]]*}"}"
                p="${p%"${p##*[![:space:]]}"}"
                [ -n "$p" ] && CRON_ARGS+=(--challenge "$p")
              done
              ;;
            *)
              echo "Unknown cron_mode: $MODE" >&2
              exit 1
              ;;
          esac

          "${CRON_ARGS[@]}"

      - name: Upload logs
        if: always() && github.event.inputs.no_log_file != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tsp-cron-run-once-${{ github.run_id }}
          path: ${{ github.event.inputs.log_dir }}
          if-no-files-found: warn
