# Every minute at :00 between window-start and window-end (inclusive), each tick runs the
# cron child (`scripts/tsp_cron_service.ts` → `dist/cli.js`). See that file for child modes.
#
# Required repository secrets:
#   STAR_DELIVERY_BASE_URL, PLAYER_GUID, PLAYER_EMAIL
#
# Child env: `tsp_cron_service` does not parse --base-url; the child reads STAR_DELIVERY_BASE_URL.
# Cron `--no-log-file` skips per-run route_solver_cron_*.log files (see workflow input no_log_file).

name: TSP cron (daily API window)

on:
  workflow_dispatch:
    inputs:
      window_start:
        description: Window start (HH:MM, local to TZ below)
        type: string
        default: "22:45"
      window_end:
        description: Window end (HH:MM, local to TZ below)
        type: string
        default: "22:50"
      timezone:
        description: IANA timezone for the window (runners are UTC unless you set this)
        type: string
        default: "UTC"
      log_dir:
        description: Log directory (relative to repo root, or absolute)
        type: string
        default: "tsp_logs"
      cron_mode:
        description: |
          Child CLI mode (must match scripts/tsp_cron_service.ts rules).
          daily-api = default; map-daily / api-map-daily need no challenge_paths; *_challenge modes need comma-separated paths.
        type: choice
        options:
          - daily-api
          - api-map-daily-api
          - map-daily-api
          - api-map-challenge
          - map-challenge
        default: daily-api
      map_path:
        description: Repo-relative map JSON (for map-daily-api, map-challenge)
        type: string
        default: "data.json"
      challenge_paths:
        description: Comma-separated repo-relative challenge JSON paths (api-map-challenge, map-challenge)
        type: string
        default: ""
      submit:
        description: Forward --submit to the child CLI
        type: boolean
        default: true
      no_log_file:
        description: |
          If true, passes --no-log-file to the cron script (no route_solver_cron_*.log under log_dir; child output to job log only). Skips log artifact upload.
        type: boolean
        default: false

jobs:
  tsp-cron:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      TZ: ${{ github.event.inputs.timezone }}
      STAR_DELIVERY_BASE_URL: ${{ secrets.STAR_DELIVERY_BASE_URL }}
      PLAYER_GUID: ${{ secrets.PLAYER_GUID }}
      PLAYER_EMAIL: ${{ secrets.PLAYER_EMAIL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Run cron window
        id: cron
        run: |
          LOG_DIR="${LOG_DIR_INPUT}"
          echo "log_dir=${LOG_DIR}" >> "$GITHUB_OUTPUT"

          MODE="${{ github.event.inputs.cron_mode }}"
          MAP="${{ github.event.inputs.map_path }}"
          CP_RAW="${{ github.event.inputs.challenge_paths }}"
          SUBMIT="${{ github.event.inputs.submit }}"
          NO_LOG="${{ github.event.inputs.no_log_file }}"

          CRON_ARGS=(node ./scripts/run-cron.mjs --every-minute --window-start="${{ github.event.inputs.window_start }}" --window-end="${{ github.event.inputs.window_end }}" --log-dir="$LOG_DIR")
          if [ "$SUBMIT" = "true" ]; then
            CRON_ARGS+=(--submit)
          fi
          if [ "$NO_LOG" = "true" ]; then
            CRON_ARGS+=(--no-log-file)
          fi

          case "$MODE" in
            daily-api) ;;
            api-map-daily-api) CRON_ARGS+=(--api-map --daily-api) ;;
            map-daily-api) CRON_ARGS+=(--map "$MAP" --daily-api) ;;
            api-map-challenge)
              CRON_ARGS+=(--api-map)
              IFS=',' read -r -a CPS <<< "$CP_RAW"
              for p in "${CPS[@]}"; do
                p="${p#"${p%%[![:space:]]*}"}"
                p="${p%"${p##*[![:space:]]}"}"
                [ -n "$p" ] && CRON_ARGS+=(--challenge "$p")
              done
              ;;
            map-challenge)
              CRON_ARGS+=(--map "$MAP")
              IFS=',' read -r -a CPS <<< "$CP_RAW"
              for p in "${CPS[@]}"; do
                p="${p#"${p%%[![:space:]]*}"}"
                p="${p%"${p##*[![:space:]]}"}"
                [ -n "$p" ] && CRON_ARGS+=(--challenge "$p")
              done
              ;;
            *)
              echo "Unknown cron_mode: $MODE" >&2
              exit 1
              ;;
          esac

          "${CRON_ARGS[@]}"
        env:
          LOG_DIR_INPUT: ${{ github.event.inputs.log_dir }}

      - name: Upload logs
        if: always() && github.event.inputs.no_log_file != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tsp-cron-logs-${{ github.run_id }}
          path: ${{ steps.cron.outputs.log_dir || github.event.inputs.log_dir || 'tsp_logs' }}
          if-no-files-found: warn
